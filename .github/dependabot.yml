version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: "09:00"
    timezone: Asia/Kolkata
  open-pull-requests-limit: 1
  rebase-strategy: auto
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: chore(deps)
  groups:
    all-updates:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  cooldown:
    default-days: 7
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: "09:00"
